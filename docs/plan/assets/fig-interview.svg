<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1060" height="520" viewBox="0 0 1060 520" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="1060" height="520" fill="#FFFFFF"/><text x="30.0" y="39.0" font-size="25.0" font-weight="700" fill="#131417" text-anchor="start">질문은 고정하고, 인식문은 추적 가능하게</text><text x="30.0" y="70.0" font-size="16.0" font-weight="400" fill="#686A72" text-anchor="start">의료 판단 없이 기록을 만드는 구조 · 예시는 허구의 시연 발화</text><rect x="30.0" y="95.0" width="310.0" height="174.0" rx="14.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="48.0" y="130.0" font-size="21.0" font-weight="700" fill="#131417" text-anchor="start">고정 질문 칸</text><text x="48.0" y="163.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">가는 길: 불편한 곳 · 언제부터</text><text x="48.0" y="188.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">양상 · 약 · 물어볼 것</text><text x="48.0" y="213.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">오는 길: 의사 말씀 · 약 변경</text><text x="48.0" y="238.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">예약 · 주의 말씀 · 다음 질문</text><rect x="375.0" y="95.0" width="310.0" height="174.0" rx="14.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="393.0" y="130.0" font-size="21.0" font-weight="700" fill="#131417" text-anchor="start">STT 인식문 + ID</text><text x="393.0" y="163.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">인식문 u1: ‘사흘전부터’</text><text x="393.0" y="188.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">언제부터 칸 → u1 + 인식문</text><text x="393.0" y="213.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">해석한 날짜에도 발화 ID 연결</text><text x="393.0" y="238.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">모호한 날짜는 ‘확인 필요’</text><rect x="720.0" y="95.0" width="310.0" height="174.0" rx="14.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="738.0" y="130.0" font-size="21.0" font-weight="700" fill="#131417" text-anchor="start">고정 서식으로 완성</text><text x="738.0" y="163.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">가는 길 → 진료 메모</text><text x="738.0" y="188.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">오는 길 → 진료 브리핑</text><text x="738.0" y="213.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">추측하거나 의료 내용을 덧붙이지 않음</text><text x="738.0" y="238.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">LLM 없이도 결과 완성</text><line x1="344.0" y1="181.0" x2="367.0" y2="181.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><line x1="689.0" y1="181.0" x2="712.0" y2="181.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><line x1="875.0" y1="272.0" x2="875.0" y2="303.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><rect x="30.0" y="310.0" width="1000.0" height="145.0" rx="14.0" fill="#EAF2FF" stroke="#E0E1E6" stroke-width="1.0"/><text x="50.0" y="343.0" font-size="21.0" font-weight="700" fill="#0050CC" text-anchor="start">선택: 기기 안 LLM 공백 정리 → 결정적 검사</text><text x="50.0" y="375.0" font-size="16.0" font-weight="400" fill="#44464E" text-anchor="start">기본 꺼짐 · 공백을 제외한 모든 문자 동일 · 숫자/단위/문장부호 보존 · 길이 ≤ 원문의 1.5배</text><text x="50.0" y="403.0" font-size="16.0" font-weight="400" fill="#44464E" text-anchor="start">통과: 공백 정리만 채택   /   거부·오류·8초 초과: 고정 서식 결과 사용</text><text x="50.0" y="433.0" font-size="14.0" font-weight="400" fill="#686A72" text-anchor="start">설계값 근거: safePolish · PolishGuard. 진단·중증도 판단·약/용량 제안은 하지 않음.</text><text x="30.0" y="490.0" font-size="17.0" font-weight="600" fill="#131417" text-anchor="start">STT 정확성 보장 아님. 가족 공유는 별도 동의 + 매번 확인. 승인 글에 개인정보 포함 가능.</text></svg>