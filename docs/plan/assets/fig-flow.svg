<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1020" height="410" viewBox="0 0 1020 410" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="1020" height="410" fill="#FFFFFF"/><text x="30.0" y="42.0" font-size="25.0" font-weight="700" fill="#131417" text-anchor="start">진료동행 · 병원에 가는 날의 대화를 잇다</text><text x="30.0" y="72.0" font-size="16.0" font-weight="400" fill="#686A72" text-anchor="start">인식문을 기록하고, 승인한 글만 가족에게</text><rect x="30.0" y="106.0" width="220.0" height="210.0" rx="16.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="48.0" y="140.0" font-size="24.0" font-weight="700" fill="#131417" text-anchor="start">가는 길</text><text x="48.0" y="169.0" font-size="14.0" font-weight="600" fill="#0050CC" text-anchor="start">목적지 + 음성</text><text x="48.0" y="207.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">불편한 곳 · 언제부터</text><text x="48.0" y="232.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">약 · 꼭 물어볼 것</text><rect x="46.0" y="264.0" width="188.0" height="34.0" rx="8.0" fill="#EAF2FF"/><text x="140.0" y="287.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="middle">진료 메모</text><line x1="254.0" y1="210.0" x2="270.0" y2="210.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><rect x="274.0" y="106.0" width="220.0" height="210.0" rx="16.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="292.0" y="140.0" font-size="24.0" font-weight="700" fill="#131417" text-anchor="start">진료</text><text x="292.0" y="169.0" font-size="14.0" font-weight="600" fill="#0050CC" text-anchor="start">도착 + P + 도어</text><text x="292.0" y="207.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">문 열림 · 주차 후 합류</text><text x="292.0" y="232.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">물어볼 것 확인</text><rect x="290.0" y="264.0" width="188.0" height="34.0" rx="8.0" fill="#EAF2FF"/><text x="384.0" y="287.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="middle">물어볼 것 준비</text><line x1="498.0" y1="210.0" x2="514.0" y2="210.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><rect x="518.0" y="106.0" width="220.0" height="210.0" rx="16.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="536.0" y="140.0" font-size="24.0" font-weight="700" fill="#131417" text-anchor="start">오는 길</text><text x="536.0" y="169.0" font-size="14.0" font-weight="600" fill="#0050CC" text-anchor="start">체류 + D + 주행 60초</text><text x="536.0" y="207.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">의사 말씀 · 바뀐 약</text><text x="536.0" y="232.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">다음 예약 · 확인할 것</text><rect x="534.0" y="264.0" width="188.0" height="34.0" rx="8.0" fill="#EAF2FF"/><text x="628.0" y="287.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="middle">진료 브리핑</text><line x1="742.0" y1="210.0" x2="758.0" y2="210.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><rect x="762.0" y="106.0" width="220.0" height="210.0" rx="16.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><text x="780.0" y="140.0" font-size="24.0" font-weight="700" fill="#131417" text-anchor="start">가족</text><text x="780.0" y="169.0" font-size="14.0" font-weight="600" fill="#0050CC" text-anchor="start">공유 동의 + 확인</text><text x="780.0" y="207.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">승인한 브리핑 전달</text><text x="780.0" y="232.0" font-size="15.0" font-weight="400" fill="#44464E" text-anchor="start">다음 정기 진료에 이어 쓰기</text><rect x="778.0" y="264.0" width="188.0" height="34.0" rx="8.0" fill="#EAF2FF"/><text x="872.0" y="287.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="middle">같이 기억하기</text><text x="30.0" y="355.0" font-size="16.0" font-weight="400" fill="#44464E" text-anchor="start">기기 안 보관 · 의료 판단 없음 · 주행 중 긴 글 숨김 · 가족에게 승인 글만 공유 · 비식별화 아님</text><text x="30.0" y="383.0" font-size="13.0" font-weight="400" fill="#686A72" text-anchor="start">기능 흐름도이며 실제 에뮬레이터 화면이 아닙니다.</text></svg>