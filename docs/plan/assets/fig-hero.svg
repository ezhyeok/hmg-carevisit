<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="440" viewBox="0 0 1080 440" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="1080" height="440" fill="#FFFFFF"/><text x="24.0" y="40.0" font-size="28.0" font-weight="700" fill="#131417" text-anchor="start">질문은 진료 전에. 들은 말은 잊기 전에.</text><text x="24.0" y="68.0" font-size="16.0" font-weight="400" fill="#686A72" text-anchor="start">부모님을 모시고 가는 날 · 운전하는 자녀와 결과를 기다리는 가족</text><rect x="24.0" y="91.0" width="356.0" height="290.0" rx="18.0" fill="#F7F8FA" stroke="#E0E1E6" stroke-width="1.0"/><rect x="420.0" y="91.0" width="636.0" height="290.0" rx="18.0" fill="#EAF2FF" stroke="#E0E1E6" stroke-width="1.0"/><text x="44.0" y="126.0" font-size="22.0" font-weight="700" fill="#44464E" text-anchor="start">오늘 · 기억에 맡긴 대화</text><text x="442.0" y="126.0" font-size="22.0" font-weight="700" fill="#0050CC" text-anchor="start">진료동행 · 왕복을 잇는 기록</text><line x1="390.0" y1="234.0" x2="409.0" y2="234.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt" marker-end="url(#arrA)"/><rect x="42.0" y="151.0" width="320.0" height="62.0" rx="10.0" fill="#FFFFFF"/><text x="56.0" y="175.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">짧은 진료</text><text x="56.0" y="199.0" font-size="14.0" font-weight="400" fill="#686A72" text-anchor="start">진료 5분 미만 응답 55.0% [2]</text><rect x="42.0" y="223.0" width="320.0" height="62.0" rx="10.0" fill="#FFFFFF"/><text x="56.0" y="247.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">놓친 질문</text><text x="56.0" y="271.0" font-size="14.0" font-weight="400" fill="#686A72" text-anchor="start">물어볼 말이 진료 뒤에 떠오른다</text><rect x="42.0" y="295.0" width="320.0" height="62.0" rx="10.0" fill="#FFFFFF"/><text x="56.0" y="319.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">다시 하는 설명</text><text x="56.0" y="343.0" font-size="14.0" font-weight="400" fill="#686A72" text-anchor="start">형제에게 전화로 들은 말을 되풀이한다</text><line x1="459.0" y1="168.0" x2="459.0" y2="339.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><rect x="482.0" y="149.0" width="554.0" height="45.0" rx="10.0" fill="#FFFFFF"/><circle cx="459.0" cy="171.0" r="14.0" fill="#0064FF"/><text x="459.0" y="177.0" font-size="16.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="498.0" y="177.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="start">가는 길</text><text x="590.0" y="177.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">음성 인터뷰</text><text x="760.0" y="177.0" font-size="14.0" font-weight="400" fill="#44464E" text-anchor="start">불편한 곳 · 약 · 물어볼 말</text><rect x="482.0" y="204.0" width="554.0" height="45.0" rx="10.0" fill="#FFFFFF"/><circle cx="459.0" cy="226.0" r="14.0" fill="#0064FF"/><text x="459.0" y="232.0" font-size="16.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="498.0" y="232.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="start">진료</text><text x="590.0" y="232.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">진료 메모</text><text x="760.0" y="232.0" font-size="14.0" font-weight="400" fill="#44464E" text-anchor="start">준비한 질문을 확인</text><rect x="482.0" y="259.0" width="554.0" height="45.0" rx="10.0" fill="#FFFFFF"/><circle cx="459.0" cy="281.0" r="14.0" fill="#0064FF"/><text x="459.0" y="287.0" font-size="16.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="498.0" y="287.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="start">오는 길</text><text x="590.0" y="287.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">진료 브리핑</text><text x="760.0" y="287.0" font-size="14.0" font-weight="400" fill="#44464E" text-anchor="start">들은 말을 고정 칸에 기록</text><rect x="482.0" y="314.0" width="554.0" height="45.0" rx="10.0" fill="#FFFFFF"/><circle cx="459.0" cy="336.0" r="14.0" fill="#0064FF"/><text x="459.0" y="342.0" font-size="16.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="498.0" y="342.0" font-size="16.0" font-weight="600" fill="#0050CC" text-anchor="start">가족</text><text x="590.0" y="342.0" font-size="18.0" font-weight="700" fill="#131417" text-anchor="start">승인한 글 공유</text><text x="760.0" y="342.0" font-size="14.0" font-weight="400" fill="#44464E" text-anchor="start">같은 내용을 함께 확인</text><text x="24.0" y="414.0" font-size="16.0" font-weight="600" fill="#44464E" text-anchor="start">목적지·기어·도어로 대화 시점 연결  ·  주행 중 음성 중심  ·  의료 판단 없음  ·  가족 공유는 확인 후</text></svg>